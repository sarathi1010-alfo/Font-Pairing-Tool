<!-- Meta SEO -->
<title>{{siteName}} — {{primaryKeyword}} | alfo.online</title>
<meta name="description" content="{{description}}">
<meta name="keywords" content="{{keywords}}">
<link rel="canonical" href="{{canonicalUrl}}">

<!-- Open Graph / Facebook -->
<meta property="og:type" content="website">
<meta property="og:url" content="{{canonicalUrl}}">
<meta property="og:title" content="{{siteName}} — {{primaryKeyword}} | alfo.online">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="{{ogImage}}">

<!-- Twitter -->
<meta property="twitter:card" content="summary_large_image">
<meta property="twitter:url" content="{{canonicalUrl}}">
<meta property="twitter:title" content="{{siteName}} — {{primaryKeyword}} | alfo.online">
<meta property="twitter:description" content="{{description}}">
<meta property="twitter:image" content="{{ogImage}}">

<!-- Schema.org -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "{{siteName}}",
  "url": "{{canonicalUrl}}",
  "description": "{{description}}",
  "applicationCategory": "{{toolCategory}}",
  "operatingSystem": "All"
}
</script>
